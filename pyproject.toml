[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wisp"
version = "0.1.0"
description = "Weighted particle/streaming PIC prototype (WISP)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wisp*"]
